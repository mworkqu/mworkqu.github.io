<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard — GESTALTUNG</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-dash-page="admin-overview">

<header class="g-nav" data-nav>
  <a class="g-logo" href="/">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x=".5" y=".5" width="17" height="17" stroke="rgba(25,23,20,.3)" stroke-width=".6"/>
      <line x1="9" y1=".5" x2="9" y2="17.5" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <line x1=".5" y1="9" x2="17.5" y2="9" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <circle cx="9" cy="9" r="2" stroke="rgba(25,23,20,.35)" stroke-width=".5" fill="none"/>
      <circle cx="9" cy="9" r=".6" fill="rgba(25,23,20,.6)"/>
    </svg>
    <span class="g-logo-text">Gestaltung</span>
  </a>
  <nav class="g-nav-links" data-nav-links>
    <a class="g-nav-link" href="/studio/">Studio</a>
    <a class="g-nav-link" href="/manufacturing/">Manufacturing</a>
    <a class="g-nav-link" href="/shop/">Shop</a>
    <a class="g-nav-link" href="/projects/">Projects</a>
    <a class="g-nav-link" href="/about/">About</a>
    <a class="g-nav-link" href="/contact/">Contact</a>
    <a class="g-nav-link access" href="/login/">Access</a>
  </nav>
  <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-menu-toggle>&#8801;</button>
</header>

<div class="demo-strip">Demo &middot; Static prototype &middot; stock and jobs stay in this browser</div>

<main class="dash-shell">

  <aside class="dash-sidebar" data-dash-sidebar data-role="admin" data-active="overview"></aside>

  <section class="dash-main">
    <p class="dash-panel-title">Overview</p>
    <h1 class="dash-heading">Admin.</h1>
    <p class="dash-subhead">What needs a decision today.</p>

    <div class="metric-grid">
      <div class="metric-card"><span class="metric-label">Need reordering</span><strong data-metric="reorder">—</strong></div>
      <div class="metric-card"><span class="metric-label">Open jobs</span><strong data-metric="jobs">—</strong></div>
      <div class="metric-card"><span class="metric-label">Client projects</span><strong data-metric="projects">—</strong></div>
      <div class="metric-card"><span class="metric-label">Awaiting approval</span><strong data-metric="quotes">—</strong></div>
    </div>

    <p class="dash-panel-title dash-section-gap">Reorder alerts</p>
    <div class="table-scroll" data-reorder-table></div>

    <div class="dash-actions dash-section-gap">
      <a class="btn btn-primary btn-arrow" href="/dashboard/admin/inventory/">Store stock</a>
      <a class="btn btn-ghost" href="/dashboard/admin/jobs/">Jobs</a>
      <a class="btn btn-ghost" href="/dashboard/admin/quotes/">Quotes</a>
    </div>
  </section>

</main>

<script src="/assets/js/product-art.js"></script>
<script src="/assets/js/store.js"></script>
<script src="/assets/js/client-store.js"></script>
<script src="/assets/js/admin-store.js"></script>
<script src="/assets/js/dash-shell.js"></script>
<script src="/assets/js/client-pages.js"></script>
<script src="/assets/js/admin-pages.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
