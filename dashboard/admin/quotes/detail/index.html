<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build quote — GESTALTUNG</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/i18n.js"></script>
</head>
<body data-dash-page="admin-quote">

<header class="g-nav" data-nav>
  <a class="g-logo" href="/">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x=".5" y=".5" width="17" height="17" stroke="rgba(25,23,20,.3)" stroke-width=".6"/>
      <line x1="9" y1=".5" x2="9" y2="17.5" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <line x1=".5" y1="9" x2="17.5" y2="9" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <circle cx="9" cy="9" r="2" stroke="rgba(25,23,20,.35)" stroke-width=".5" fill="none"/>
      <circle cx="9" cy="9" r=".6" fill="rgba(25,23,20,.6)"/>
    </svg>
    <span class="g-logo-text">Gestaltung</span>
  </a>
  <nav class="g-nav-links" data-nav-links>
    <a class="g-nav-link" href="/studio/" data-i18n="nav.studio">Studio</a>
    <a class="g-nav-link" href="/manufacturing/" data-i18n="nav.manufacturing">Manufacturing</a>
    <a class="g-nav-link" href="/shop/" data-i18n="nav.shop">Shop</a>
    <a class="g-nav-link" href="/projects/" data-i18n="nav.projects">Projects</a>
    <a class="g-nav-link" href="/about/" data-i18n="nav.about">About</a>
    <a class="g-nav-link" href="/contact/" data-i18n="nav.contact">Contact</a>
    <a class="g-nav-link access" href="/login/" data-i18n="nav.access">Access</a>
    <button class="lang-toggle" type="button" data-lang-toggle lang="ar">العربية</button>
  </nav>
  <button class="menu-toggle" type="button" data-i18n-aria-label="nav.menu" aria-label="Open menu" aria-expanded="false" data-menu-toggle>&#8801;</button>
</header>

<div class="demo-strip" data-i18n="demo.strip">Demo &middot; Static prototype &middot; stock and jobs stay in this browser</div>

<main class="dash-shell">

  <aside class="dash-sidebar" data-dash-sidebar data-role="admin" data-active="quotes"></aside>

  <section class="dash-main">
    <p class="dash-panel-title"><span data-quote-ref>—</span></p>
    <h1 class="dash-heading" data-quote-title data-i18n="quoteBuild.h1">Quote</h1>
    <p class="dash-subhead"><span class="badge active" data-quote-state>—</span></p>

    <div class="dash-panel">
      <p class="dash-panel-title" data-i18n="quoteBuild.work">The work</p>
      <form class="g-form" data-quote-form novalidate>
        <div class="field">
          <label for="q-hours" data-i18n="quoteBuild.designHours">Design hours</label>
          <input type="number" id="q-hours" name="designHours" min="0" value="12">
        </div>
        <div class="field">
          <label for="q-rate" data-i18n="quoteBuild.rate">Hourly rate</label>
          <input type="number" id="q-rate" name="rate" min="0" value="350">
        </div>
        <div class="field">
          <label for="q-prod" data-i18n="quoteBuild.production">Production</label>
          <input type="number" id="q-prod" name="production" min="0" value="1450">
        </div>
        <div class="field">
          <label for="q-cont" data-i18n="quoteBuild.contingency">Contingency %</label>
          <input type="number" id="q-cont" name="contingencyPct" min="0" max="100" value="10">
        </div>
      </form>
    </div>

    <div class="table-scroll" data-quote-detail></div>

    <div class="dash-actions dash-section-gap">
      <button class="btn btn-primary btn-arrow" type="button" data-send-quote data-i18n="quoteBuild.send">Send to client</button>
      <a class="btn btn-ghost" href="/dashboard/admin/quotes/" data-i18n="quoteBuild.back">Back to quotes</a>
      <p class="field-note" data-quote-note role="status"></p>
    </div>
  </section>

</main>

<script src="/assets/js/product-art.js"></script>
<script src="/assets/js/store.js"></script>
<script src="/assets/js/client-store.js"></script>
<script src="/assets/js/admin-store.js"></script>
<script src="/assets/js/dash-shell.js"></script>
<script src="/assets/js/client-pages.js"></script>
<script src="/assets/js/admin-pages.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
