<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop — GESTALTUNG</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-dash-page="vendor-jobs">

<header class="g-nav" data-nav>
  <a class="g-logo" href="/">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x=".5" y=".5" width="17" height="17" stroke="rgba(25,23,20,.3)" stroke-width=".6"/>
      <line x1="9" y1=".5" x2="9" y2="17.5" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <line x1=".5" y1="9" x2="17.5" y2="9" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <circle cx="9" cy="9" r="2" stroke="rgba(25,23,20,.35)" stroke-width=".5" fill="none"/>
      <circle cx="9" cy="9" r=".6" fill="rgba(25,23,20,.6)"/>
    </svg>
    <span class="g-logo-text">Gestaltung</span>
  </a>
  <nav class="g-nav-links" data-nav-links>
    <a class="g-nav-link" href="/studio/">Studio</a>
    <a class="g-nav-link" href="/manufacturing/">Manufacturing</a>
    <a class="g-nav-link" href="/shop/">Shop</a>
    <a class="g-nav-link" href="/projects/">Projects</a>
    <a class="g-nav-link" href="/about/">About</a>
    <a class="g-nav-link" href="/contact/">Contact</a>
    <a class="g-nav-link access" href="/login/">Access</a>
  </nav>
  <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-menu-toggle>&#8801;</button>
</header>

<div class="demo-strip">Demo &middot; Static prototype &middot; stock and jobs stay in this browser</div>

<main class="dash-shell">

  <aside class="dash-sidebar" data-dash-sidebar data-role="vendor" data-active="jobs"></aside>

  <section class="dash-main">
    <p class="dash-panel-title">My jobs</p>
    <h1 class="dash-heading"><span data-vendor-name>Workshop</span>.</h1>
    <p class="dash-subhead">
      What to make, how many, and when it is due. Prices and client names are not
      shown here.
    </p>

    <div class="dash-actions" style="margin-bottom:24px">
      <label class="mono small" for="v-pick">Signed in as</label>
      <select class="mini-select" id="v-pick" data-vendor-picker>
        <option>Workshop A</option>
        <option>Workshop B</option>
      </select>
    </div>

    <div class="table-scroll" data-vendor-open></div>
    <p class="field-note" data-vendor-note role="status"></p>

    <div class="dash-panel dash-section-gap" data-ready-panel hidden>
      <p class="dash-panel-title">Mark ready — <span data-ready-job></span></p>
      <div class="g-form">
        <div class="field">
          <label for="v-qty">How many did you actually make?</label>
          <input type="number" id="v-qty" min="1" value="1" data-ready-qty>
        </div>
        <div class="field">
          <label for="v-note">Note</label>
          <input type="text" id="v-note" placeholder="Inspection result, anything that went wrong…" data-ready-note>
        </div>
        <div class="field span-2 dash-actions">
          <button class="btn btn-primary" type="button" data-ready-confirm>Confirm ready</button>
          <button class="btn btn-ghost" type="button" data-ready-cancel>Cancel</button>
          <p class="field-error" data-ready-error role="alert"></p>
        </div>
      </div>
    </div>

    <p class="dash-panel-title dash-section-gap">Finished</p>
    <div class="table-scroll" data-vendor-done></div>
  </section>

</main>

<script src="/assets/js/product-art.js"></script>
<script src="/assets/js/store.js"></script>
<script src="/assets/js/client-store.js"></script>
<script src="/assets/js/admin-store.js"></script>
<script src="/assets/js/dash-shell.js"></script>
<script src="/assets/js/client-pages.js"></script>
<script src="/assets/js/admin-pages.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
