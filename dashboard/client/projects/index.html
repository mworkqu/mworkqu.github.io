<div class="demo-strip">Demo &middot; Static prototype &middot; your data stays in this browser</div>

<main class="dash-shell">

  <aside class="dash-sidebar" data-dash-sidebar data-role="client" data-active="projects"></aside>

  <section class="dash-main">
    <p class="dash-panel-title">My projects</p>
    <h1 class="dash-heading">Projects.</h1>
    <p class="dash-subhead">Open a project to build its parts list.</p>

    <div class="table-scroll" data-project-list></div>

    <div class="dash-panel dash-section-gap">
      <p class="dash-panel-title">Start a project</p>
      <form class="g-form" data-project-form novalidate>

        <div class="field span-2">
          <label>What do you need?</label>
          <div class="choice-row">
            <label class="choice"><input type="radio" name="type" value="design"> Design and build it</label>
            <label class="choice"><input type="radio" name="type" value="make"> Make it from my files</label>
          </div>
        </div>

        <div class="field">
          <label for="p-title">Project name</label>
          <input type="text" id="p-title" name="title_" placeholder="e.g. Meridian display unit">
        </div>

        <div class="field">
          <label for="p-date">Target date</label>
          <input type="date" id="p-date" name="targetDate">
        </div>

        <div class="field span-2">
          <label for="p-brief">What are you trying to achieve?</label>
          <textarea id="p-brief" name="brief" rows="5" placeholder="The goal, the constraints, anything that would change the approach."></textarea>
        </div>

        <div class="field span-2" data-when="make" hidden>
          <label for="p-process">Process</label>
          <select id="p-process" name="process">
            <option>CNC machining</option>
            <option>Laser cutting</option>
            <option>3D printing</option>
            <option>Sheet metal</option>
            <option>Injection moulding</option>
            <option>Not sure</option>
          </select>
        </div>

        <div class="field span-2" data-when="design" hidden>
          <label for="p-service">Primary service</label>
          <select id="p-service" name="service">
            <option>Industrial design</option>
            <option>Mechanical engineering</option>
            <option>3D modelling</option>
            <option>Technical drawing</option>
            <option>Design for manufacture</option>
            <option>Not sure</option>
          </select>
        </div>

        <div class="field span-2">
          <button class="btn btn-primary btn-arrow" type="submit">Create project</button>
          <p class="field-error" data-error role="alert"></p>
        </div>

      </form>
    </div>
  </section>

</main>
