</head>
<body data-client-page="projects">

<header class="g-nav" data-nav>
  <a class="g-logo" href="/">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x=".5" y=".5" width="17" height="17" stroke="rgba(25,23,20,.3)" stroke-width=".6"/>
      <line x1="9" y1=".5" x2="9" y2="17.5" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <line x1=".5" y1="9" x2="17.5" y2="9" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <circle cx="9" cy="9" r="2" stroke="rgba(25,23,20,.35)" stroke-width=".5" fill="none"/>
      <circle cx="9" cy="9" r=".6" fill="rgba(25,23,20,.6)"/>
    </svg>
    <span class="g-logo-text">Gestaltung</span>
  </a>
  <nav class="g-nav-links" data-nav-links>
    <a class="g-nav-link" href="/studio/" data-i18n="nav.studio">Studio</a>
    <a class="g-nav-link" href="/manufacturing/" data-i18n="nav.manufacturing">Manufacturing</a>

  </nav>
  <button class="menu-toggle" type="button" data-i18n-aria-label="nav.menu" aria-label="Open menu" aria-expanded="false" data-menu-toggle>&#8801;</button>
</header>

<div class="demo-strip" data-i18n="demo.strip">Demo &middot; Static prototype &middot; your data stays in this browser</div>

<main class="dash-shell">

  <aside class="dash-sidebar" data-dash-sidebar data-role="client" data-active="projects"></aside>

  <section class="dash-main">
    <p class="dash-panel-title" data-i18n="common.myProjects">My projects</p>
    <h1 class="dash-heading" data-i18n="clientProjects.h1">Projects.</h1>
    <p class="dash-subhead" data-i18n="clientProjects.sub">Open a project to build its parts list.</p>

    <div class="table-scroll" data-project-list></div>

    <div class="dash-panel dash-section-gap">
      <p class="dash-panel-title" data-i18n="common.startProject">Start a project</p>
      <form class="g-form" data-project-form novalidate>

        <div class="field span-2">
          <label data-i18n="clientProjects.what">What do you need?</label>
          <div class="choice-row">
            <label class="choice"><input type="radio" name="type" value="design"> Design and build it</label>
            <label class="choice"><input type="radio" name="type" value="make"> Make it from my files</label>
          </div>
        </div>

        <div class="field">
          <label for="p-title" data-i18n="clientProjects.name">Project name</label>
          <input type="text" id="p-title" name="title_" placeholder="e.g. Meridian display unit">
        </div>

        <div class="field">
          <label for="p-date" data-i18n="clientProjects.target">Target date</label>
          <input type="date" id="p-date" name="targetDate">
        </div>

        <div class="field span-2">
          <label for="p-brief" data-i18n="clientProjects.goal">What are you trying to achieve?</label>
          <textarea id="p-brief" name="brief" rows="5" placeholder="The goal, the constraints, anything that would change the approach."></textarea>
        </div>

        <div class="field span-2" data-when="make" hidden>
          <label for="p-process" data-i18n="clientProjects.process">Process</label>
          <select id="p-process" name="process">
            <option data-i18n="clientProjects.cnc">CNC machining</option>
            <option data-i18n="clientProjects.laser">Laser cutting</option>
            <option data-i18n="clientProjects.print">3D printing</option>
            <option data-i18n="clientProjects.sheet">Sheet metal</option>
            <option data-i18n="clientProjects.mould">Injection moulding</option>
            <option data-i18n="common.notSure">Not sure</option>
          </select>
        </div>

        <div class="field span-2" data-when="design" hidden>
          <label for="p-service" data-i18n="clientProjects.service">Primary service</label>
          <select id="p-service" name="service">
            <option data-i18n="clientProjects.indDesign">Industrial design</option>
            <option data-i18n="clientProjects.mech">Mechanical engineering</option>
            <option data-i18n="clientProjects.model">3D modelling</option>
            <option data-i18n="clientProjects.drawing">Technical drawing</option>
            <option data-i18n="clientProjects.dfm">Design for manufacture</option>
            <option data-i18n="common.notSure">Not sure</option>
          </select>
        </div>

        <div class="field span-2">
          <button class="btn btn-primary btn-arrow" type="submit" data-i18n="clientProjects.create">Create project</button>
          <p class="field-error" data-error role="alert"></p>
        </div>

      </form>
    </div>
  </section>

</main>

<script src="/assets/js/product-art.js"></script>
<script src="/assets/js/store.js"></script>
<script src="/assets/js/client-store.js"></script>
<script src="/assets/js/admin-store.js"></script>

<script src="/assets/js/admin-pages.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
