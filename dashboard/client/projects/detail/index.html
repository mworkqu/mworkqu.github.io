<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-client-page="detail">

<header class="g-nav" data-nav>
  <a class="g-logo" href="/">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x=".5" y=".5" width="17" height="17" stroke="rgba(25,23,20,.3)" stroke-width=".6"/>
      <line x1="9" y1=".5" x2="9" y2="17.5" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <line x1=".5" y1="9" x2="17.5" y2="9" stroke="rgba(25,23,20,.2)" stroke-width=".5"/>
      <circle cx="9" cy="9" r="2" stroke="rgba(25,23,20,.35)" stroke-width=".5" fill="none"/>
      <circle cx="9" cy="9" r=".6" fill="rgba(25,23,20,.6)"/>
    </svg>
    <span class="g-logo-text">Gestaltung</span>
  </a>
  <nav class="g-nav-links" data-nav-links>
    <a class="g-nav-link" href="/studio/">Studio</a>
    <a class="g-nav-link" href="/manufacturing/">Manufacturing</a>
    <a class="g-nav-link" href="/shop/">Shop</a>
    <a class="g-nav-link" href="/projects/">Projects</a>
    <a class="g-nav-link" href="/about/">About</a>
    <a class="g-nav-link" href="/contact/">Contact</a>
    <a class="g-nav-link access" href="/login/">Access</a>
  </nav>
  <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-menu-toggle>&#8801;</button>
</header>

<div class="demo-strip">Demo &middot; Static prototype &middot; your data stays in this browser</div>

<main class="dash-shell">

  <aside class="dash-sidebar" data-dash-sidebar data-role="client" data-active="projects"></aside>

  <section class="dash-main">
    <p class="dash-panel-title"><span data-project-ref>—</span></p>
    <h1 class="dash-heading" data-project-title>Project</h1>
    <p class="dash-subhead"><span class="badge active" data-project-state>—</span></p>
    <p class="dash-subhead" data-project-brief></p>

    <p class="dash-panel-title dash-section-gap">Parts</p>
    <div class="table-scroll" data-project-detail></div>

    <div data-quote-panel></div>

    <div class="dash-panel dash-section-gap">
      <p class="dash-panel-title">Add a part</p>
      <div class="dash-actions" style="margin-bottom:14px">
        <input class="qty-input" type="number" min="1" value="1" data-part-qty aria-label="Quantity">
        <input class="text-input" type="text" data-part-search placeholder="Search your inventory and the shop&hellip;">
      </div>
      <div data-part-results></div>
      <p class="field-note" data-part-note role="status"></p>
    </div>

    <div class="dash-actions dash-section-gap">
      <a class="btn btn-ghost" href="/dashboard/client/projects/">Back to projects</a>
      <button class="btn btn-ghost" type="button" data-cancel-project>Cancel project</button>
    </div>
  </section>

</main>

<script src="/assets/js/product-art.js"></script>
<script src="/assets/js/store.js"></script>
<script src="/assets/js/client-store.js"></script>
<script src="/assets/js/admin-store.js"></script>
<script src="/assets/js/dash-shell.js"></script>
<script src="/assets/js/client-pages.js"></script>
<script src="/assets/js/admin-pages.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
