<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GESTALTUNG | From Ideas to Manufactured Products</title>
  <meta name="description" content="GESTALTUNG is an engineering studio, manufacturing platform, and product-commerce system — based in Doha, Qatar.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- React + Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    /* ─── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0C1B2E;
      --navy-mid:   #122035;
      --navy-light: #1A2F48;
      --blue:       #1B53BE;
      --blue-hover: #1647A8;
      --blue-light: #E8EFFC;
      --text:       #0F1923;
      --muted:      #5C6B7A;
      --muted-lt:   #8A99A8;
      --border:     #DDE1E7;
      --bg-soft:    #F3F5F8;
      --white:      #FFFFFF;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--white);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(27,83,190,0.25); border-radius: 2px; }

    /* ─── Nav ───────────────────────────────────────────── */
    #g-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      background: rgba(255,255,255,0.97);
      border-bottom: 1px solid var(--border);
      transition: box-shadow 0.4s ease;
    }
    #g-nav.scrolled {
      box-shadow: 0 2px 24px rgba(12,27,46,0.10);
    }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 0.25s ease;
    }
    .nav-link:hover { color: var(--navy); }

    /* ─── Buttons ───────────────────────────────────────── */
    .btn-blue {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--blue);
      color: #fff;
      padding: 14px 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-blue:hover {
      background: var(--blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(27,83,190,0.30);
    }

    .btn-blue-outline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--blue);
      padding: 13px 29px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1.5px solid var(--blue);
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }
    .btn-blue-outline:hover {
      background: var(--blue);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-navy {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--navy);
      color: #fff;
      padding: 14px 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s ease;
    }
    .btn-navy:hover { background: var(--navy-light); transform: translateY(-1px); }

    .btn-white-outline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: rgba(255,255,255,0.85);
      padding: 13px 29px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1.5px solid rgba(255,255,255,0.30);
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }
    .btn-white-outline:hover {
      border-color: rgba(255,255,255,0.70);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ─── Section reveal ────────────────────────────────── */
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.in { opacity: 1; transform: translateY(0); }

    /* ─── Card hover ────────────────────────────────────── */
    .service-card {
      transition: box-shadow 0.35s ease, transform 0.35s ease, border-color 0.35s ease;
    }
    .service-card:hover {
      box-shadow: 0 12px 48px rgba(12,27,46,0.10);
      transform: translateY(-4px);
      border-color: var(--blue) !important;
    }

    .pillar-col {
      transition: background 0.3s ease;
    }
    .pillar-col:hover {
      background: #EAF0FB;
    }

    /* ─── Section separator ─────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 14px;
    }

    /* ─── Step number ───────────────────────────────────── */
    .step-num {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--blue-light);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 20px;
    }

    /* ─── Cap tag ───────────────────────────────────────── */
    .cap-tag {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      padding: 8px 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      cursor: default;
      border-radius: 2px;
    }
    .cap-tag:hover {
      background: var(--blue-light);
      border-color: rgba(27,83,190,0.25);
      color: var(--blue);
    }

    /* ─── Blueprint bg for accent sections ──────────────── */
    .bg-grid-subtle {
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ─── Hover underline link ──────────────────────────── */
    .link-arrow {
      font-size: 13px;
      font-weight: 600;
      color: var(--blue);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.25s ease, opacity 0.25s ease;
    }
    .link-arrow:hover { gap: 10px; opacity: 0.80; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ═══ ICONS ═════════════════════════════════════════════ */
const ArrowRight = ({ size = 14 }) => (
  <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
    <path d="M1 7h12M7 1l6 6-6 6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

const IconHandshake = () => (
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1B53BE" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M14 22l-4 4M26 22l4 4M14 22l6-6 6 6"/>
    <path d="M8 26l4-4 6 4 6-4 4 4"/>
    <path d="M4 18l4 8M36 18l-4 8"/>
    <circle cx="20" cy="12" r="3"/>
  </svg>
);

const IconGear = () => (
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1B53BE" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="20" cy="20" r="5"/>
    <path d="M20 6v4M20 30v4M6 20h4M30 20h4M9.17 9.17l2.83 2.83M27.17 27.17l2.83 2.83M30.83 9.17l-2.83 2.83M12.83 27.17l-2.83 2.83"/>
  </svg>
);

const IconChart = () => (
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1B53BE" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <rect x="6"  y="24" width="7" height="10" rx="1"/>
    <rect x="16" y="16" width="7" height="18" rx="1"/>
    <rect x="26" y="8"  width="7" height="26" rx="1"/>
    <path d="M4 36h32"/>
  </svg>
);

const IconShield = () => (
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1B53BE" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M20 4l12 4v12c0 8-5 13-12 16C13 33 8 28 8 20V8l12-4z"/>
    <path d="M14 20l4 4 8-8"/>
  </svg>
);

const IconBulb = () => (
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1B53BE" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M20 6a10 10 0 0 1 7 17l-1 3H14l-1-3A10 10 0 0 1 20 6z"/>
    <path d="M15 30h10M16 34h8"/>
  </svg>
);

/* ═══ LOGO ═══════════════════════════════════════════════ */
const Logo = ({ light = false }) => (
  <a href="/" style={{ display: 'flex', alignItems: 'center', gap: 11, textDecoration: 'none' }}>
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="0.5" y="0.5" width="27" height="27"
        stroke={light ? 'rgba(255,255,255,0.35)' : 'rgba(12,27,46,0.30)'} strokeWidth="0.8"/>
      <rect x="4.5" y="4.5" width="19" height="19"
        stroke={light ? 'rgba(255,255,255,0.18)' : 'rgba(12,27,46,0.14)'} strokeWidth="0.6"/>
      <line x1="4.5" y1="14" x2="23.5" y2="14"
        stroke={light ? 'rgba(255,255,255,0.22)' : '#1B53BE'} strokeWidth="0.7"/>
      <line x1="14" y1="4.5" x2="14" y2="23.5"
        stroke={light ? 'rgba(255,255,255,0.22)' : '#1B53BE'} strokeWidth="0.7"/>
      <circle cx="14" cy="14" r="3.2"
        stroke={light ? 'rgba(255,255,255,0.40)' : '#1B53BE'} strokeWidth="0.7" fill="none"/>
      <circle cx="14" cy="14" r="0.9"
        fill={light ? 'rgba(255,255,255,0.70)' : '#1B53BE'}/>
    </svg>
    <span style={{
      fontFamily: 'Inter, sans-serif',
      fontSize: 14,
      fontWeight: 700,
      letterSpacing: '0.20em',
      color: light ? '#FFFFFF' : 'var(--navy)',
    }}>
      GESTALTUNG
    </span>
  </a>
);

/* ═══ NAVIGATION ═════════════════════════════════════════ */
const Nav = () => {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 48);
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const links = ['Studio', 'Manufacturing', 'Shop', 'Projects', 'About', 'Contact'];

  return (
    <nav id="g-nav" className={scrolled ? 'scrolled' : ''}>
      <Logo />
      <div style={{ display: 'flex', gap: 36, alignItems: 'center' }}>
        {links.map(l => (
          <a key={l} href={`/${l.toLowerCase()}/`} className="nav-link">{l}</a>
        ))}
      </div>
      <a href="/studio/#request" className="btn-blue" style={{ fontSize: 11, padding: '10px 22px' }}>
        Start a Project <ArrowRight />
      </a>
    </nav>
  );
};

/* ═══ HERO ═══════════════════════════════════════════════ */
const Hero = () => (
  <section style={{
    minHeight: '100vh',
    display: 'grid',
    gridTemplateColumns: '1fr 1fr',
    position: 'relative',
    overflow: 'hidden',
  }}>
    {/* ── Left panel ── */}
    <div className="bg-grid-subtle" style={{
      background: 'linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%)',
      display: 'flex',
      flexDirection: 'column',
      justifyContent: 'center',
      padding: '120px 72px 80px 72px',
      position: 'relative',
      zIndex: 1,
    }}>
      {/* Blue accent line */}
      <div style={{ width: 56, height: 3, background: 'var(--blue)', marginBottom: 36 }} />

      <h1 style={{
        fontFamily: 'Inter, sans-serif',
        fontSize: 'clamp(36px, 4.5vw, 62px)',
        fontWeight: 800,
        lineHeight: 1.12,
        color: '#FFFFFF',
        margin: '0 0 28px',
        letterSpacing: '-0.02em',
      }}>
        From Ideas<br/>
        to Manufactured<br/>
        <span style={{ color: 'rgba(255,255,255,0.55)' }}>Products.</span>
      </h1>

      <p style={{
        fontSize: 15,
        fontWeight: 300,
        lineHeight: 1.80,
        color: 'rgba(255,255,255,0.62)',
        maxWidth: 380,
        margin: '0 0 44px',
      }}>
        GESTALTUNG partners with innovators to turn concepts, sketches, and engineering challenges into precision-manufactured, real-world products.
      </p>

      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
        <a href="/studio/#request" className="btn-blue">
          Learn More <ArrowRight />
        </a>
        <a href="/manufacturing/" className="btn-white-outline">
          Upload a File
        </a>
      </div>

      {/* Bottom meta */}
      <div style={{
        position: 'absolute',
        bottom: 44,
        left: 72,
        display: 'flex',
        gap: 28,
      }}>
        {[['Doha, Qatar', 'Location'], ['Est. 2024', 'Founded'], ['End-to-End', 'Service']].map(([val, lbl]) => (
          <div key={lbl}>
            <div style={{ fontSize: 13, fontWeight: 600, color: 'rgba(255,255,255,0.80)', lineHeight: 1.3 }}>{val}</div>
            <div style={{ fontSize: 10, fontWeight: 400, color: 'rgba(255,255,255,0.32)', letterSpacing: '0.06em', textTransform: 'uppercase', marginTop: 2 }}>{lbl}</div>
          </div>
        ))}
      </div>
    </div>

    {/* ── Right panel — hero image placeholder ── */}
    {/*
      HERO IMAGE: Replace this div with:
      <div style={{ backgroundImage: 'url(your-hero-image.jpg)', backgroundSize: 'cover', backgroundPosition: 'center' }} />
    */}
    <div style={{
      background: 'linear-gradient(160deg, #162840 0%, #0C1B2E 50%, #1A3050 100%)',
      position: 'relative',
      overflow: 'hidden',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
    }}>
      {/* Technical illustration placeholder */}
      <svg width="360" height="360" viewBox="0 0 360 360" fill="none" style={{ opacity: 0.14 }}>
        {/* Grid */}
        {Array.from({ length: 7 }, (_, i) => (
          <g key={i}>
            <line x1={i * 60} y1="0" x2={i * 60} y2="360" stroke="white" strokeWidth="0.5"/>
            <line x1="0" y1={i * 60} x2="360" y2={i * 60} stroke="white" strokeWidth="0.5"/>
          </g>
        ))}
        {/* Central geometry */}
        <circle cx="180" cy="180" r="120" stroke="white" strokeWidth="0.8" strokeDasharray="6 6"/>
        <circle cx="180" cy="180" r="80"  stroke="white" strokeWidth="1.0"/>
        <circle cx="180" cy="180" r="40"  stroke="white" strokeWidth="0.8" strokeDasharray="4 4"/>
        <circle cx="180" cy="180" r="6"   stroke="white" strokeWidth="1.0" fill="none"/>
        <circle cx="180" cy="180" r="2"   fill="white"/>
        {/* Crosshairs */}
        <line x1="60"  y1="180" x2="300" y2="180" stroke="white" strokeWidth="0.6"/>
        <line x1="180" y1="60"  x2="180" y2="300" stroke="white" strokeWidth="0.6"/>
        {/* Dimension arcs */}
        <path d="M 180 60 A 120 120 0 0 1 300 180" stroke="white" strokeWidth="0.5" fill="none" strokeDasharray="3 6"/>
        {/* Tick marks */}
        {[0,45,90,135,180,225,270,315].map(deg => {
          const r = (deg * Math.PI) / 180;
          return (
            <line key={deg}
              x1={180 + 76 * Math.cos(r)} y1={180 + 76 * Math.sin(r)}
              x2={180 + 84 * Math.cos(r)} y2={180 + 84 * Math.sin(r)}
              stroke="white" strokeWidth="0.8"/>
          );
        })}
        {/* Corner brackets */}
        <path d="M 20 20 h 30 M 20 20 v 30" stroke="white" strokeWidth="1"/>
        <path d="M 340 20 h -30 M 340 20 v 30" stroke="white" strokeWidth="1"/>
        <path d="M 20 340 h 30 M 20 340 v -30" stroke="white" strokeWidth="1"/>
        <path d="M 340 340 h -30 M 340 340 v -30" stroke="white" strokeWidth="1"/>
      </svg>

      {/* Subtle vertical label */}
      <span style={{
        position: 'absolute',
        right: 28,
        top: '50%',
        transform: 'translateY(-50%) rotate(90deg)',
        fontFamily: 'Inter, sans-serif',
        fontSize: 9,
        fontWeight: 500,
        letterSpacing: '0.24em',
        textTransform: 'uppercase',
        color: 'rgba(255,255,255,0.22)',
        whiteSpace: 'nowrap',
      }}>
        Engineering · Manufacturing · Commerce
      </span>
    </div>
  </section>
);

/* ═══ FOUR PILLARS ═══════════════════════════════════════ */
const Pillars = () => {
  const pillars = [
    { Icon: IconHandshake, title: 'Client Focused',       desc: 'We build strong partnerships and deliver exceptional value on every project we take on.' },
    { Icon: IconBulb,      title: 'Innovation Driven',    desc: 'We embrace new ideas, cutting-edge processes, and technology to solve complex challenges.' },
    { Icon: IconChart,     title: 'Results Oriented',     desc: 'We are committed to delivering measurable, real-world results that move your product forward.' },
    { Icon: IconShield,    title: 'Integrity First',      desc: 'We operate with full transparency, accountability, and the highest professional standards.' },
  ];

  return (
    <section className="reveal" style={{ background: 'var(--bg-soft)', borderTop: '1px solid var(--border)' }}>
      <div style={{ maxWidth: 1240, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)' }}>
        {pillars.map(({ Icon, title, desc }, i) => (
          <div key={i} className="pillar-col" style={{
            padding: '60px 40px',
            borderRight: i < 3 ? '1px solid var(--border)' : 'none',
            textAlign: 'center',
          }}>
            <div style={{ marginBottom: 24, display: 'flex', justifyContent: 'center' }}>
              <Icon />
            </div>
            <h3 style={{ fontSize: 16, fontWeight: 700, color: 'var(--text)', marginBottom: 12, letterSpacing: '-0.01em' }}>{title}</h3>
            <p style={{ fontSize: 13.5, fontWeight: 400, lineHeight: 1.75, color: 'var(--muted)' }}>{desc}</p>
          </div>
        ))}
      </div>
    </section>
  );
};

/* ═══ SERVICES ═══════════════════════════════════════════ */
const Services = () => {
  const services = [
    {
      num: '01',
      tag: 'Design & Engineering',
      title: 'Studio',
      headline: 'Bring the idea.',
      desc: 'For sketches, concepts, broken parts, reverse engineering challenges, and products that need to be designed from the ground up.',
      href: '/studio/',
      cta: 'Explore Studio',
    },
    {
      num: '02',
      tag: 'Production Platform',
      title: 'Manufacturing',
      headline: 'Make it real.',
      desc: 'For CAD files, STL models, and engineering drawings that need careful quotation, material selection, and production oversight.',
      href: '/manufacturing/',
      cta: 'Explore Manufacturing',
    },
    {
      num: '03',
      tag: 'Product Commerce',
      title: 'Shop',
      headline: 'Live with the result.',
      desc: 'Ready-made engineered products, digital files, educational kits, and small-batch manufactured items — curated and available now.',
      href: '/shop/',
      cta: 'Explore Shop',
    },
  ];

  return (
    <section className="reveal" style={{ padding: '120px 60px', background: '#fff' }}>
      <div style={{ maxWidth: 1240, margin: '0 auto' }}>
        {/* Header */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 60, flexWrap: 'wrap', gap: 20 }}>
          <div>
            <p className="section-label">What We Do</p>
            <h2 style={{ fontSize: 'clamp(28px, 3.2vw, 44px)', fontWeight: 800, color: 'var(--navy)', lineHeight: 1.15, letterSpacing: '-0.02em', maxWidth: 480 }}>
              A complete path from concept to finished product.
            </h2>
          </div>
          <a href="/about/" className="link-arrow">
            Our Full Approach <ArrowRight />
          </a>
        </div>

        {/* Cards */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24 }}>
          {services.map((s, i) => (
            <a key={i} href={s.href} className="service-card" style={{
              background: '#fff',
              border: '1px solid var(--border)',
              padding: '44px 40px 40px',
              textDecoration: 'none',
              color: 'inherit',
              display: 'flex',
              flexDirection: 'column',
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 36 }}>
                <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', color: 'var(--muted-lt)', textTransform: 'uppercase' }}>{s.num}</span>

/* ═══ APP ════════════════════════════════════════════════ */
const App = () => {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io  = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }),
      { threshold: 0.06 }
    );
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <Nav />
      <Hero />
      <Pillars />
      <Services />
      <Manifesto />
      <Workflow />
      <Capabilities />
      <DesignSpace />
      <CTA />
      <Footer />
    </>
  );
};
