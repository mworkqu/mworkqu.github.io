<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GESTALTUNG — Engineering Studio</title>
  <meta name="description" content="GESTALTUNG is an engineering studio, manufacturing platform, and product-commerce system — Doha, Qatar.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@200;300;400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        }
      }}
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F8F8F6;
      --surface: #FFFFFF;
      --ink:     #0A0A0A;
      --rule:    rgba(10,10,10,0.07);
      --muted:   rgba(10,10,10,0.38);
      --dim:     rgba(10,10,10,0.20);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }

    /* ── The only high-contrast element ── */
    .btn-machine {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--ink);
      color: var(--bg);
      padding: 12px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16,1,0.3,1);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-machine:hover { opacity: 0.75; transform: translateY(-1px); }

    /* ── Nav ── */
    #g-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 72px;
      background: rgba(248,248,246,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--rule);
      transition: box-shadow 0.4s ease;
    }
    #g-nav.scrolled { box-shadow: 0 1px 32px rgba(10,10,10,0.07); }

    .nav-link {
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: var(--ink); }

    /* ── CAD grid ── */
    .cad-grid {
      background-color: #FAFAF9;
      background-image:
        linear-gradient(rgba(10,10,10,0.048) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,10,10,0.048) 1px, transparent 1px),
        linear-gradient(rgba(10,10,10,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,10,10,0.022) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    }

    /* ── Service row ── */
    .service-row {
      display: grid;
      grid-template-columns: 52px 200px 1fr auto;
      align-items: center;
      gap: 32px;
      padding: 26px 0;
      border-top: 0.5px solid var(--rule);
      text-decoration: none;
      color: inherit;
      transition: background 0.2s ease;
    }
    .service-row:last-child { border-bottom: 0.5px solid var(--rule); }
    .service-row:hover { background: rgba(10,10,10,0.018); }
    .service-row:hover .row-arrow { transform: translate(3px, -3px); color: var(--ink); }
    .row-arrow { transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), color 0.2s ease; color: var(--dim); }

    /* ── Reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .reveal.in { opacity: 1; transform: translateY(0); }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-thumb { background: rgba(10,10,10,0.10); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── Icons  (Lucide SVG paths — lucide.dev ISC License) ── */
const Icon = ({ name, size = 14, strokeWidth = 1.5 }) => {
  const d = {
    'arrow-right':    'M5 12h14M12 5l7 7-7 7',
    'arrow-up-right': 'M7 17L17 7M7 7h10v10',
    'chevron-right':  'M9 18l6-6-6-6',
    'minus':          'M5 12h14',
    'plus':           'M12 5v14M5 12h14',
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round">
      <path d={d[name]}/>
    </svg>
  );
};

/* ── Logo ── */
const Logo = () => (
  <a href="/" style={{ display:'flex', alignItems:'center', gap:10, textDecoration:'none' }}>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect x=".4" y=".4" width="19.2" height="19.2" stroke="rgba(10,10,10,0.22)" strokeWidth=".6"/>
      <rect x="3.5" y="3.5" width="13" height="13" stroke="rgba(10,10,10,0.09)" strokeWidth=".5"/>
      <line x1="3.5" y1="10" x2="16.5" y2="10" stroke="rgba(10,10,10,0.18)" strokeWidth=".5"/>
      <line x1="10" y1="3.5" x2="10" y2="16.5" stroke="rgba(10,10,10,0.18)" strokeWidth=".5"/>
      <circle cx="10" cy="10" r="2.2" stroke="rgba(10,10,10,0.28)" strokeWidth=".5" fill="none"/>
      <circle cx="10" cy="10" r=".65" fill="rgba(10,10,10,0.45)"/>
    </svg>
    <span className="mono" style={{
      fontSize: 11.5,
      fontWeight: 400,
      letterSpacing: '0.26em',
      color: 'rgba(10,10,10,0.72)',
    }}>
      GESTALTUNG
    </span>
  </a>
);

/* ═══════════════════════════════
   NAV
═══════════════════════════════ */
const Nav = () => {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <nav id="g-nav" className={scrolled ? 'scrolled' : ''}>
      <Logo />
      <div style={{ display:'flex', gap:36, alignItems:'center' }}>
        {[
          ['Studio',        '/studio/'],
          ['Manufacturing', '/manufacturing/'],
          ['Shop',          '/shop/'],
          ['Access',        '/login/'],
        ].map(([label, href]) => (
          <a key={label} href={href} className="nav-link">{label}</a>
        ))}
      </div>
      <a href="/studio/#request" className="btn-machine">
        Start a Project <Icon name="arrow-right" size={12}/>
      </a>
    </nav>
  );
};

/* ═══════════════════════════════
   HERO
═══════════════════════════════ */
const Hero = () => (
  <section style={{
    minHeight: '100vh',
    padding: '0 72px',
    display: 'flex',
    flexDirection: 'column',
    justifyContent: 'flex-end',
    paddingBottom: 72,
    paddingTop: 60,
    maxWidth: 1440,
    margin: '0 auto',
    width: '100%',
    position: 'relative',
  }}>

    {/* Top metadata strip */}
    <div className="mono" style={{
      position: 'absolute',
      top: 80, left: 72, right: 72,
      display: 'flex',
      justifyContent: 'space-between',
      alignItems: 'center',
      fontSize: 8.5,
      fontWeight: 300,
      letterSpacing: '0.20em',
      textTransform: 'uppercase',
      color: 'rgba(10,10,10,0.22)',
    }}>
      <span>Gestaltung — Engineering Studio</span>
      <span style={{ borderLeft:'0.5px solid rgba(10,10,10,0.10)', paddingLeft:20 }}>
        25.2N · 51.5E · Doha, QAT
      </span>
      <span style={{ borderLeft:'0.5px solid rgba(10,10,10,0.10)', paddingLeft:20 }}>
        Est. MMXXIV · Rev 1.0
      </span>
    </div>

    {/* Headline */}
    <h1 style={{
      fontSize: 'clamp(58px, 8.5vw, 120px)',
      fontWeight: 200,
      lineHeight: 0.98,
      letterSpacing: '-0.03em',
      color: '#0A0A0A',
      margin: '0 0 48px',
      maxWidth: 900,
    }}>
      From Ideas<br/>
      to Manufactured<br/>
      Products.
    </h1>

    {/* Description + CTA row */}
    <div style={{ display:'flex', alignItems:'center', gap:52, flexWrap:'wrap' }}>
      <p style={{
        fontSize: 14,
        fontWeight: 300,
        lineHeight: 1.80,
        color: 'rgba(10,10,10,0.44)',
        maxWidth: 360,
        margin: 0,
      }}>
        An engineering studio, manufacturing platform, and product-commerce system — end to end.
      </p>
      <a href="/studio/#request" className="btn-machine">
        Start a Project <Icon name="arrow-right" size={13}/>
      </a>
    </div>

    {/* Bottom rule + tripartite label */}
    <div style={{ marginTop:60, paddingTop:20, borderTop:'0.5px solid rgba(10,10,10,0.08)' }}>
      <div className="mono" style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(3,1fr)',
        fontSize: 8.5,
        fontWeight: 300,
        letterSpacing: '0.20em',
        textTransform: 'uppercase',
        color: 'rgba(10,10,10,0.22)',
      }}>
        <span>Engineering Studio</span>
        <span style={{ textAlign:'center' }}>Manufacturing Platform</span>
        <span style={{ textAlign:'right' }}>Product Commerce</span>
      </div>
    </div>
  </section>
);

/* ═══════════════════════════════
   SERVICE INDEX
═══════════════════════════════ */
const Services = () => {
  const rows = [
    {
      num: '01',
      title: 'Studio',
      sub: 'Design & Engineering',
      desc: 'Concepts, sketches, reverse engineering, and full product design — from first principles to production-ready files.',
      href: '/studio/',
    },
    {
      num: '02',
      title: 'Manufacturing',
      sub: 'Production Platform',
      desc: 'CAD files, STL models, and technical drawings — quoted, produced, and delivered through a single workflow.',
      href: '/manufacturing/',
    },
    {
      num: '03',
      title: 'Shop',
      sub: 'Product Commerce',
      desc: 'Engineered products, digital files, educational kits, and small-batch manufactured items — curated and ready.',
      href: '/shop/',
    },
  ];

  return (
    <section className="reveal" style={{ borderTop:'0.5px solid rgba(10,10,10,0.07)' }}>
      <div style={{ maxWidth:1440, margin:'0 auto', padding:'0 72px' }}>

        {/* Section label row */}
        <div style={{
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'baseline',
          padding: '28px 0 4px',
        }}>
          <span className="mono" style={{
            fontSize: 8.5,
            fontWeight: 300,
            letterSpacing: '0.22em',
            textTransform: 'uppercase',
            color: 'rgba(10,10,10,0.28)',
          }}>
            Service Index
          </span>
          <a href="/about/" style={{
            fontFamily: 'Inter, sans-serif',
            fontSize: 11,
            fontWeight: 300,
            color: 'rgba(10,10,10,0.36)',
            textDecoration: 'none',
            letterSpacing: '0.03em',
            transition: 'color 0.2s ease',
          }}
          onMouseEnter={e => e.currentTarget.style.color='rgba(10,10,10,0.80)'}
          onMouseLeave={e => e.currentTarget.style.color='rgba(10,10,10,0.36)'}
          >
            Our approach →
          </a>
        </div>

        {/* Rows */}
        {rows.map((r, i) => (
          <a key={i} href={r.href} className="service-row">
            <span className="mono" style={{
              fontSize: 9,
              fontWeight: 300,
              letterSpacing: '0.14em',
              color: 'rgba(10,10,10,0.22)',
            }}>
              {r.num}
            </span>

            <div>
              <div style={{ fontSize:17, fontWeight:400, letterSpacing:'-0.01em', marginBottom:4 }}>
                {r.title}
              </div>
              <div className="mono" style={{
                fontSize: 8.5,
                fontWeight: 300,
                letterSpacing: '0.16em',
                textTransform: 'uppercase',
                color: 'rgba(10,10,10,0.28)',
              }}>
                {r.sub}
              </div>
            </div>

            <p style={{
              fontSize: 13,
              fontWeight: 300,
              lineHeight: 1.75,
              color: 'rgba(10,10,10,0.44)',
              maxWidth: 440,
              margin: 0,
            }}>
              {r.desc}
            </p>

            <span className="row-arrow">
              <Icon name="arrow-up-right" size={17} strokeWidth={1.2}/>
            </span>
          </a>
        ))}

        <div style={{ padding:'40px 0 72px' }}/>
      </div>
    </section>
  );
};

/* ═══════════════════════════════
   DESIGN SPACE — CAD Interface
═══════════════════════════════ */
const DesignSpace = () => {
  const [activeLayer, setActiveLayer] = useState('assembly');

  const layers = [
    { id:'assembly',   label:'Assembly View', on:true  },
    { id:'structural', label:'Structural',    on:false },
    { id:'surface',    label:'Surface Mesh',  on:false },
    { id:'dims',       label:'Dimensions',    on:true  },
    { id:'notes',      label:'Annotations',   on:false },
  ];

  const props = [
    ['Material',   'Aluminium 6061'],
    ['Process',    '5-axis CNC'],
    ['Tolerance',  '±0.05 mm'],
    ['Finish',     'Anodised Type II'],
    ['Scale',      '1 : 1'],
  ];

  return (
    <section className="reveal" style={{ borderTop:'0.5px solid rgba(10,10,10,0.07)' }}>
      <div style={{ maxWidth:1440, margin:'0 auto', padding:'0 72px 80px' }}>

        {/* Section header */}
        <div style={{
          display:'flex', justifyContent:'space-between',
          alignItems:'baseline', padding:'28px 0 20px',
        }}>
          <span className="mono" style={{
            fontSize:8.5, fontWeight:300,
            letterSpacing:'0.22em', textTransform:'uppercase',
            color:'rgba(10,10,10,0.28)',
          }}>
            Design Atelier — Status: In Development
          </span>
          <a href="/contact/" style={{
            fontFamily:'Inter, sans-serif', fontSize:11, fontWeight:300,
            color:'rgba(10,10,10,0.36)', textDecoration:'none',
            letterSpacing:'0.03em', transition:'color 0.2s ease',
          }}
          onMouseEnter={e => e.currentTarget.style.color='rgba(10,10,10,0.80)'}
          onMouseLeave={e => e.currentTarget.style.color='rgba(10,10,10,0.36)'}
          >
            Register interest →
          </a>
        </div>

        {/* CAD window */}
        <div style={{ border:'0.5px solid rgba(10,10,10,0.12)', background:'#FDFDFC' }}>

          {/* ── Title bar ── */}
          <div className="mono" style={{
            height:32, padding:'0 14px',
            display:'flex', alignItems:'center', justifyContent:'space-between',
            borderBottom:'0.5px solid rgba(10,10,10,0.07)',
            background:'rgba(10,10,10,0.022)',
          }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ display:'flex', gap:5 }}>
                {[0.14,0.09,0.06].map((o,i) => (
                  <div key={i} style={{ width:9, height:9, borderRadius:'50%', background:`rgba(10,10,10,${o})` }}/>
                ))}
              </div>
              <span style={{ fontSize:9.5, fontWeight:400, letterSpacing:'0.12em', color:'rgba(10,10,10,0.42)', textTransform:'uppercase' }}>
                Gestaltung Design Atelier — Untitled.gst
              </span>
            </div>
            <span style={{ fontSize:8.5, fontWeight:300, letterSpacing:'0.08em', color:'rgba(10,10,10,0.24)' }}>
              v2.0 · in development
            </span>
          </div>

          {/* ── Menu bar ── */}
          <div className="mono" style={{
            height:26, padding:'0 14px',
            display:'flex', alignItems:'center',
            borderBottom:'0.5px solid rgba(10,10,10,0.055)',
            gap:2,
          }}>
            {['File','Edit','View','Insert','Select','Tools','Help'].map(m => (
              <span key={m} style={{
                padding:'0 11px', fontSize:10.5, fontWeight:300,
                color:'rgba(10,10,10,0.38)', cursor:'default',
                letterSpacing:'0.02em',
              }}>{m}</span>
            ))}
          </div>

          {/* ── Workspace ── */}
          <div style={{ display:'grid', gridTemplateColumns:'168px 1fr', height:460 }}>

            {/* Layer panel */}
            <div style={{ borderRight:'0.5px solid rgba(10,10,10,0.07)', display:'flex', flexDirection:'column' }}>

              <div className="mono" style={{
                padding:'10px 14px 8px',
                borderBottom:'0.5px solid rgba(10,10,10,0.055)',
                fontSize:8.5, fontWeight:400,
                letterSpacing:'0.18em', textTransform:'uppercase',
                color:'rgba(10,10,10,0.32)',
              }}>
                Layers
              </div>

              {layers.map(l => (
                <div key={l.id} onClick={() => setActiveLayer(l.id)} style={{
                  padding:'8px 14px',
                  display:'flex', alignItems:'center', gap:8,
                  cursor:'pointer',
                  background: activeLayer===l.id ? 'rgba(10,10,10,0.032)' : 'transparent',
                  borderLeft: activeLayer===l.id ? '1.5px solid rgba(10,10,10,0.48)' : '1.5px solid transparent',
                  transition:'background 0.15s ease',
                }}>
                  <div style={{
                    width:5.5, height:5.5, borderRadius:'50%', flexShrink:0,
                    background: l.on ? 'rgba(10,10,10,0.42)' : 'transparent',
                    border:'0.5px solid rgba(10,10,10,0.22)',
                  }}/>
                  <span className="mono" style={{
                    fontSize:9.5,
                    fontWeight: l.on ? 400 : 300,
                    color: l.on ? 'rgba(10,10,10,0.65)' : 'rgba(10,10,10,0.30)',
                    letterSpacing:'0.02em',
                  }}>
                    {l.label}
                  </span>
                </div>
              ))}

              {/* Properties */}
              <div style={{ marginTop:'auto', padding:'12px 14px', borderTop:'0.5px solid rgba(10,10,10,0.055)' }}>
                <div className="mono" style={{
                  fontSize:8.5, fontWeight:300,
                  letterSpacing:'0.16em', textTransform:'uppercase',
                  color:'rgba(10,10,10,0.25)', marginBottom:10,
                }}>
                  Properties
                </div>
                {props.map(([k,v]) => (
                  <div key={k} style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                    <span className="mono" style={{ fontSize:8.5, fontWeight:300, color:'rgba(10,10,10,0.30)', letterSpacing:'0.02em' }}>{k}</span>
                    <span className="mono" style={{ fontSize:8.5, fontWeight:400, color:'rgba(10,10,10,0.52)', letterSpacing:'0.02em' }}>{v}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Viewport */}
            <div className="cad-grid" style={{ position:'relative', overflow:'hidden' }}>

              {/* Corner brackets */}
              {[
                { top:10, left:10,  borderTop:'0.5px solid rgba(10,10,10,0.18)', borderLeft: '0.5px solid rgba(10,10,10,0.18)' },
                { top:10, right:10, borderTop:'0.5px solid rgba(10,10,10,0.18)', borderRight:'0.5px solid rgba(10,10,10,0.18)' },
                { bottom:10, left:10,  borderBottom:'0.5px solid rgba(10,10,10,0.18)', borderLeft: '0.5px solid rgba(10,10,10,0.18)' },
                { bottom:10, right:10, borderBottom:'0.5px solid rgba(10,10,10,0.18)', borderRight:'0.5px solid rgba(10,10,10,0.18)' },
              ].map((s,i) => <div key={i} style={{ position:'absolute', width:14, height:14, ...s }}/>)}

              {/* Viewport label */}
              <div className="mono" style={{
                position:'absolute', top:14, left:22,
                fontSize:8.5, fontWeight:300,
                letterSpacing:'0.14em', textTransform:'uppercase',
                color:'rgba(10,10,10,0.20)',
              }}>
                Top View · Orthographic
              </div>

              {/* Technical drawing SVG */}
              <svg
                style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}
                viewBox="0 0 680 460"
                fill="none"
                preserveAspectRatio="xMidYMid meet"
              >
                {/* Outer dashed */}
                <circle cx="340" cy="230" r="150" stroke="rgba(10,10,10,0.06)" strokeWidth="0.6" strokeDasharray="9 7"/>
                {/* Primary */}
                <circle cx="340" cy="230" r="108" stroke="rgba(10,10,10,0.11)" strokeWidth="0.8"/>
                {/* Inner dashed */}
                <circle cx="340" cy="230" r="62"  stroke="rgba(10,10,10,0.06)" strokeWidth="0.6" strokeDasharray="4 6"/>
                {/* Center mark */}
                <circle cx="340" cy="230" r="5.5" stroke="rgba(10,10,10,0.28)" strokeWidth="0.7" fill="none"/>
                <circle cx="340" cy="230" r="1.4" fill="rgba(10,10,10,0.38)"/>
                {/* Crosshairs */}
                <line x1="100" y1="230" x2="580" y2="230" stroke="rgba(10,10,10,0.09)" strokeWidth="0.5"/>
                <line x1="340" y1="50"  x2="340" y2="410" stroke="rgba(10,10,10,0.09)" strokeWidth="0.5"/>
                {/* 45° lines */}
                <line x1="188" y1="78"  x2="492" y2="382" stroke="rgba(10,10,10,0.04)" strokeWidth="0.5"/>
                <line x1="492" y1="78"  x2="188" y2="382" stroke="rgba(10,10,10,0.04)" strokeWidth="0.5"/>
                {/* Dimension baseline */}
                <line x1="100" y1="418" x2="580" y2="418" stroke="rgba(10,10,10,0.13)" strokeWidth="0.5"/>
                <line x1="100" y1="410" x2="100" y2="426" stroke="rgba(10,10,10,0.13)" strokeWidth="0.5"/>

/* ═══════════════════════════════
   APP
═══════════════════════════════ */
const App = () => {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io  = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      }),
      { threshold: 0.04 }
    );
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <Nav />
      <Hero />
      <Services />
      <DesignSpace />
      <Capabilities />
      <Footer />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
